<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="google-site-verification" content="c8dp-XW0tAZaG2KrHUtnOym8UKOloaH43ED7qwsI8Ww" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Free, timed, adaptive Digital SAT practice tests with real question bank data, vocabulary SRS trainer, and offline analytics.">
  <title>Sevrony - Free Adaptive SAT Practice Tests</title>
  <link rel="canonical" href="https://sharthak-sev.github.io/Sevrony/" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" sizes="any">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sevrony - Free Adaptive SAT Practice Tests">
  <meta property="og:description" content="Free, timed, adaptive Digital SAT practice tests with real question bank data, vocabulary SRS trainer, and offline analytics.">
  <meta property="og:url" content="https://sharthak-sev.github.io/Sevrony/">
  <meta property="og:image" content="https://sharthak-sev.github.io/Sevrony/apple-touch-icon.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sevrony - Free Adaptive SAT Practice Tests">
  <meta name="twitter:description" content="Free, timed, adaptive Digital SAT practice tests with real question bank data, vocabulary SRS trainer, and offline analytics.">
  <meta name="twitter:image" content="https://sharthak-sev.github.io/Sevrony/apple-touch-icon.png">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalApplication",
    "name": "Sevrony",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All",
    "description": "Free, timed, adaptive Digital SAT practice tests with real question bank data, vocabulary SRS trainer, and offline analytics.",
    "url": "https://sharthak-sev.github.io/Sevrony/",
    "offers": {
      "@type": "Offer",
      "price": "0"
    }
  }
  </script>

  <!-- Fonts & CDN Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- KaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css?v=2.2.0">

  <!-- Tailwind CSS compiled production build -->
  <link rel="stylesheet" href="tailwind.css?v=2.2.0">

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div id="app">
    <div class="boot-shell">
      <div class="boot-card">
        <img class="boot-logo" src="logo.svg" alt="Sevrony" width="48" height="48">
        <div class="boot-text">
          <h1>Sevrony</h1>
          <p>Loading local practice data…</p>
        </div>
        <div class="boot-progress-bg">
          <div class="boot-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <input id="fileInput" type="file" accept=".sat-test,application/json,.json,text/plain,*/*" multiple hidden>
  <script defer src="db.js?v=2.2.0"></script>
  <script defer src="sync.js?v=2.2.0"></script>
  <script defer src="vocab.js?v=2.2.0"></script>
  <script defer src="scoring.js?v=2.2.0"></script>
  <script defer src="app.js?v=2.2.0"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.error("SW reg failed", err));
      });
    }
  </script>
</body>
</html>
