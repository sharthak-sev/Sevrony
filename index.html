  <!-- Tailwind CSS for Shadcn Components (Preflight disabled) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          fontFamily: {
            marketing: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            border: "hsl(240 5.9% 90%)",
            input: "hsl(240 5.9% 90%)",
            ring: "hsl(240 10% 3.9%)",
            background: "hsl(0 0% 100%)",
            foreground: "hsl(240 10% 3.9%)",
            primary: {
              DEFAULT: "hsl(240 5.9% 10%)",
              foreground: "hsl(0 0% 98%)",
            },
            secondary: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 5.9% 10%)",
            },
            destructive: {
              DEFAULT: "hsl(0 84.2% 60.2%)",
              foreground: "hsl(0 0% 98%)",
            },
            muted: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 3.8% 46.1%)",
            },
            accent: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 5.9% 10%)",
            },
            popover: {
              DEFAULT: "hsl(0 0% 100%)",
              foreground: "hsl(240 10% 3.9%)",
            },
            card: {
              DEFAULT: "hsl(0 0% 100%)",
              foreground: "hsl(240 10% 3.9%)",
            },
            cta: {
              DEFAULT: "hsl(240 5.9% 10%)", // Pure dark CTA
              foreground: "hsl(0 0% 98%)",
            }
          },
          borderRadius: {
            lg: "var(--radius-lg)",
            md: "var(--radius-md)",
            sm: "var(--radius-sm)",
          },
          keyframes: {
            "fade-in-up": {
              "0%": { opacity: "0", transform: "translateY(20px)" },
              "100%": { opacity: "1", transform: "translateY(0)" }
            }
          },
          animation: {
            "fade-in-up": "fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards"
          }
        }
      }
    }
  </script>

<body>
  <div id="app" class="app-shell">
    <div class="boot-card">

  <input id="fileInput" type="file" accept=".sat-test,application/json,.json,text/plain,*/*" hidden>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.error("SW reg failed", err));
      });
    }
  </script>
