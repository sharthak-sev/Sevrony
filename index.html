<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sevrony</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="description" content="Take timed, adaptive SAT practice tests with real question bank data. Track performance, review answers, and identify weaknesses — all offline and free.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Sentry Error Logging -->
  <script src="https://js.sentry-cdn.com/610da841a6875eae790cbc1fd6ea96b1.min.js" crossorigin="anonymous"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


  <!-- KaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css">

  <!-- Tailwind CSS for Shadcn Components (Preflight disabled) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          fontFamily: {
            marketing: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            border: "hsl(240 5.9% 90%)",
            input: "hsl(240 5.9% 90%)",
            ring: "hsl(240 10% 3.9%)",
            background: "hsl(0 0% 100%)",
            foreground: "hsl(240 10% 3.9%)",
            primary: {
              DEFAULT: "hsl(240 5.9% 10%)",
              foreground: "hsl(0 0% 98%)",
            },
            secondary: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 5.9% 10%)",
            },
            destructive: {
              DEFAULT: "hsl(0 84.2% 60.2%)",
              foreground: "hsl(0 0% 98%)",
            },
            muted: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 3.8% 46.1%)",
            },
            accent: {
              DEFAULT: "hsl(240 4.8% 95.9%)",
              foreground: "hsl(240 5.9% 10%)",
            },
            popover: {
              DEFAULT: "hsl(0 0% 100%)",
              foreground: "hsl(240 10% 3.9%)",
            },
            card: {
              DEFAULT: "hsl(0 0% 100%)",
              foreground: "hsl(240 10% 3.9%)",
            },
            cta: {
              DEFAULT: "hsl(240 5.9% 10%)", // Pure dark CTA
              foreground: "hsl(0 0% 98%)",
            }
          },
          borderRadius: {
            lg: "var(--radius-lg)",
            md: "var(--radius-md)",
            sm: "var(--radius-sm)",
          },
          keyframes: {
            "fade-in-up": {
              "0%": { opacity: "0", transform: "translateY(20px)" },
              "100%": { opacity: "1", transform: "translateY(0)" }
            }
          },
          animation: {
            "fade-in-up": "fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards"
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot-card">
      <div class="loader"></div>
      <p>Loading local practice data…</p>
    </div>
  </div>
  <input id="fileInput" type="file" accept=".sat-test,application/json,.json,text/plain,*/*" hidden>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.error("SW reg failed", err));
      });
    }
  </script>
</body>
</html>
